<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Longevity Co. — Access</title>
  <meta name="description" content="Longevity Co. private access." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="password.css?v=1" />
</head>
<body>
  <main class="gate">
    <div class="gate-video" aria-hidden="true">
      <video autoplay muted loop playsinline preload="auto">
        <source src="assets/home-bg.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="gate-overlay" aria-hidden="true"></div>

    <section class="gate-stage" aria-labelledby="gate-title">
      <div class="gate-stack">
        <img src="assets/site-logi.png" alt="Longevity" class="gate-logo" />

        <div class="gate-release">
          <p class="gate-kicker">PUBLIC RELEASE</p>
          <h1 id="gate-title">THURSDAY / OCTOBER 08</h1>
          <p class="gate-time">7:00 PM EDT</p>
        </div>

        <div class="gate-countdown" id="gate-countdown" aria-label="Countdown to launch">
          <div><strong id="count-days">00</strong><span>DAYS</span></div>
          <i>:</i>
          <div><strong id="count-hours">00</strong><span>HOURS</span></div>
          <i>:</i>
          <div><strong id="count-minutes">00</strong><span>MINUTES</span></div>
          <i>:</i>
          <div><strong id="count-seconds">00</strong><span>SECONDS</span></div>
        </div>

        <form class="gate-form" id="gate-form" autocomplete="off">
          <label for="gate-password">PRIVATE ACCESS</label>
          <div class="gate-input-row">
            <input id="gate-password" name="password" type="password" autocomplete="current-password" placeholder="PASSWORD" required />
            <button type="submit">ENTER</button>
          </div>
          <p class="gate-message" id="gate-message" aria-live="polite"></p>
        </form>

        <p class="gate-footer">LONGEVITY CO. / 2026</p>
      </div>
    </section>
  </main>
  <script src="password.js?v=1"></script>
</body>
</html>
