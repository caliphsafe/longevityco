<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lookbook | Longevity Co.</title>
  <meta
    name="description"
    content="Explore the Longevity lookbook through five editorial looks presented in a clean, image-first format."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="site-shell">
    <div id="site-header"></div>

    <main>
      <section class="lookbook-intro-minimal">
        <div class="container">
          <div class="lookbook-intro-inner">
            <p class="lookbook-kicker reveal-up">Lookbook</p>
            <h1 class="lookbook-title reveal-up">Winter 26'</h1>
          </div>
        </div>
      </section>

      <section class="lookbook-sequence">
        <div class="container">
          <section class="look-chapter">
            <div class="look-number reveal-up">01</div>
            <div class="look-grid look-grid-final">
              <figure class="look-frame look-frame-main reveal-left">
                <img src="assets/look/look1_1.png" alt="Look 1 image 1" />
              </figure>
              <figure class="look-frame reveal-up">
                <img src="assets/look/look1_2.png" alt="Look 1 image 2" />
              </figure>
              <figure class="look-frame reveal-right">
                <img src="assets/look/look1_3.png" alt="Look 1 image 3" />
              </figure>
            </div>
          </section>

          <section class="look-chapter">
            <div class="look-number reveal-up">02</div>
            <div class="look-grid look-grid-final">
              <figure class="look-frame look-frame-main reveal-left">
                <img src="assets/look/look2_1.png" alt="Look 2 image 1" />
              </figure>
              <figure class="look-frame reveal-up">
                <img src="assets/look/look2_2.png" alt="Look 2 image 2" />
              </figure>
              <figure class="look-frame reveal-right">
                <img src="assets/look/look2_3.png" alt="Look 2 image 3" />
              </figure>
            </div>
          </section>

          <section class="look-chapter">
            <div class="look-number reveal-up">03</div>
            <div class="look-grid look-grid-final">
              <figure class="look-frame look-frame-main reveal-left">
                <img src="assets/look/look3_1.png" alt="Look 3 image 1" />
              </figure>
              <figure class="look-frame reveal-up">
                <img src="assets/look/look3_2.png" alt="Look 3 image 2" />
              </figure>
              <figure class="look-frame reveal-right">
                <img src="assets/look/look3_3.png" alt="Look 3 image 3" />
              </figure>
            </div>
          </section>

          <section class="look-chapter">
            <div class="look-number reveal-up">04</div>
            <div class="look-grid look-grid-final">
              <figure class="look-frame look-frame-main reveal-left">
                <img src="assets/look/look4_1.png" alt="Look 4 image 1" />
              </figure>
              <figure class="look-frame reveal-up">
                <img src="assets/look/look4_2.png" alt="Look 4 image 2" />
              </figure>
              <figure class="look-frame reveal-right">
                <img src="assets/look/look4_3.png" alt="Look 4 image 3" />
              </figure>
            </div>
          </section>

          <section class="look-chapter">
            <div class="look-number reveal-up">05</div>
            <div class="look-grid look-grid-final">
              <figure class="look-frame look-frame-main reveal-left">
                <img src="assets/look/look5_1.png" alt="Look 5 image 1" />
              </figure>
              <figure class="look-frame reveal-up">
                <img src="assets/look/look5_2.png" alt="Look 5 image 2" />
              </figure>
              <figure class="look-frame reveal-right">
                <img src="assets/look/look5_3.png" alt="Look 5 image 3" />
              </figure>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </div>

  <script src="components.js?v=1"></script>
<script src="script.js?v=8"></script>
</body>
</html>
