<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | Longevity Co.</title>
  <meta
    name="description"
    content="Review your selected Longevity items and continue to checkout."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Courier+Prime:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body>
  <div class="site-shell">
    <div id="site-header"></div>

    <main>
      <section class="page-hero shop-hero-minimal">
        <div class="container">
          <div class="shop-hero-bar reveal-up">
            <p class="shop-hero-kicker">Cart</p>
            <h1>Your Selection</h1>
          </div>
        </div>
      </section>

      <section class="section cart-section">
        <div class="container">
          <div class="cart-layout">
            <div class="cart-items-wrap reveal-left">
              <div class="cart-items-header">
                <span>Items</span>
                <span data-cart-count-label>0 items</span>
              </div>

              <div id="cart-items" class="cart-items"></div>

              <div id="cart-empty" class="cart-empty" hidden>
                <p>Your cart is empty.</p>
                <a href="shop.html" class="btn btn-solid">Return to Shop</a>
              </div>
            </div>

            <aside class="cart-summary reveal-right">
              <div class="cart-summary-inner">
                <p class="cart-summary-kicker">Summary</p>

                <div class="cart-summary-row">
                  <span>Subtotal</span>
                  <span id="cart-subtotal">$0</span>
                </div>

                <div class="cart-summary-row">
                  <span>Shipping</span>
                  <span>Calculated at checkout</span>
                </div>

                <div class="cart-summary-row">
                  <span>Tax</span>
                  <span>Calculated at checkout</span>
                </div>

                <div class="cart-summary-total">
                  <span>Total</span>
                  <span id="cart-total">$0</span>
                </div>

                <button
                  class="add-cart-btn cart-checkout-btn"
                  type="button"
                  id="checkout-placeholder-btn"
                >
                  Checkout
                </button>

                <p class="cart-summary-note">
                  You will be redirected to secure Shopify checkout.
                </p>
              </div>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </div>

  <script src="components.js?v=1"></script>
  <script src="script.js?v=9"></script>
</body>
</html>
